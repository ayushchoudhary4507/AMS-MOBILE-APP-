name: ams_mobile_app
description: "Attendance Management System Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP Client
  dio: ^5.7.0

  # Socket IO
  socket_io_client: ^3.0.2
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.3.0

  # Local Storage & Biometrics
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.69.0

  # Calendar
  table_calendar: ^3.1.3

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Google Fonts (for Inter font)
  google_fonts: ^6.2.1

  # Date Formatting
  intl: ^0.20.1

  # Icons
  flutter_svg: ^2.0.10+1

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Loading indicators
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
